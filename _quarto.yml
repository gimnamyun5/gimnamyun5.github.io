project:
  type: website
  output-dir: _site

website:
  title: "Nam Yoon Kim"
  description: "Undergraduate Researcher in Statistics — biostatistics, machine learning for healthcare, and statistical network analysis."
  site-url: "https://gimnamyun5.github.io/"
  repo-url: "https://github.com/gimnamyun5/gimnamyun5.github.io"
  favicon: images/favicon.png                           # PLACEHOLDER: add a favicon or delete this line

  navbar:
    pinned: true
    right:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: activities.qmd
        text: "Activities & Photos"
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publications

  page-footer:
    # Raw HTML so the mailto link escapes Pandoc's email obfuscation.
    left: |
      <div class="footer-id"><span class="footer-name">Nam Yoon Kim</span><span class="footer-sub">Personal website</span></div>
    right: |
      <div class="footer-contact"><span class="footer-heading">Contact</span><a href="mailto:namyoon2000@jbnu.ac.kr">namyoon2000@jbnu.ac.kr</a><a href="tel:+821023908797">+82 10-2390-8797</a></div>
    border: true

format:
  html:
    theme: cosmo
    css: styles.css
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    anchor-sections: true
    smooth-scroll: false
    link-external-newwindow: true
    email-obfuscation: javascript
    grid:
      body-width: 1250px

execute:
  freeze: auto

editor: source
